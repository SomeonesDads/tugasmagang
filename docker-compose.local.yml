services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sri_dev
      POSTGRES_USER: sri
      POSTGRES_PASSWORD: sri_dev_password
    volumes:
      - sri_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sri -d sri_dev"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sri_dev
      DATABASE_USER: sri
      DATABASE_PASSWORD: sri_dev_password
      ENABLE_PIPELINE: "false"
    command: ["python", "seed_development.py"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sri_dev
      DATABASE_USER: sri
      DATABASE_PASSWORD: sri_dev_password
      ENABLE_PIPELINE: "false"
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  telegram-bot:
    profiles: ["bot"]
    build:
      context: ./frontend
    environment:
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-replace_me}
      API_BASE_URL: http://backend:8000/api
      ENGINEER_DISTRICT: Medan
    depends_on:
      backend:
        condition: service_started

volumes:
  sri_dev_postgres:
